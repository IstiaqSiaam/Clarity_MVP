name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: corepack enable || true
      - run: corepack prepare pnpm@latest --activate || npm i -g pnpm
      - run: pnpm install
      - run: pnpm lint || true
      - run: pnpm build || true

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install uv
        run: pip install uv
      - run: uv sync
      - run: uv run python -m compileall .
      - run: docker build -t clarity-api:ci .

  nlp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nlp_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install uv
        run: pip install uv
      - run: uv sync
      - run: uv run python -m compileall .
      - run: docker build -t clarity-nlp:ci .
