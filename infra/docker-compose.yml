services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarity}
      POSTGRES_DB: ${POSTGRES_DB:-clarity}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clarity}']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-clarity}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-clarity}
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongodata:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ['../.env']
    environment:
      API_PORT: 8000
      # Override URLs for Docker network
      POSTGRES_URL: postgresql://clarity:clarity@postgres:5432/clarity
      MONGO_URL: mongodb://clarity:clarity@mongo:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
    ports: ['127.0.0.1:8000:8000']
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['uv', 'run', 'uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']

  nlp:
    build:
      context: ../apps/nlp_service
      dockerfile: Dockerfile
    env_file: ['../.env']
    environment:
      # Override URLs for Docker network
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://clarity:clarity@mongo:27017/?authSource=admin
    volumes:
      - ../apps/nlp_service:/app
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ['uv', 'run', 'python', '-m', 'nlp.worker.consumer']

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    env_file: ['../.env']
    environment:
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:8000'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: ['pnpm', 'dev', '--port', '3000', '--hostname', '0.0.0.0']

volumes:
  pgdata:
  mongodata:
